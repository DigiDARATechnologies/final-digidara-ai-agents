name: DigiDARA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  python-syntax:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python services
        run: |
          python -m compileall -q \
            agents/orchestrator \
            agents/project_AI_Agent \
            agents/codeforge_agent/services/lms-api \
            agents/communication-ai-agent/backend \
            agents/aptitude_agent \
            agents/resume_builder_agent/backend \
            agents/certificate_agent

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create CI-only env files from examples
        shell: bash
        run: |
          set -euo pipefail
          for directory in agents/orchestrator agents/project_AI_Agent agents/codeforge_agent/services/lms-api agents/communication-ai-agent/backend agents/aptitude_agent agents/resume_builder_agent/backend agents/certificate_agent docker/mysql; do
            if [ -f "$directory/.env.example" ]; then
              cp "$directory/.env.example" "$directory/.env"
            else
              touch "$directory/.env"
            fi
          done
          # Judge0 config is deployment-local; validation needs the env file to exist.
          touch agents/codeforge_agent/judge0/judge0.conf

      - name: Validate Compose file
        run: docker compose config --quiet

  docker-build:
    name: Docker tests - ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent:
          - orchestrator
          - capstone-agent
          - codeforge-agent
          - communication-agent
          - aptitude-agent
          - resume-builder-agent
          - certificate-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install health check dependencies
        run: python -m pip install 'pytest>=8.3,<10'

      - name: Build agent, check health, and run existing test suite
        run: python scripts/test_agents.py --agent "${{ matrix.agent }}"

      - name: Upload agent test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-tests-${{ matrix.agent }}
          path: artifacts/agent-tests/${{ matrix.agent }}/
          if-no-files-found: warn

  frontend-docker:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f Dockerfile.frontend -t digidara-frontend:test .

  selenium-linux:
    name: Selenium - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium test dependencies
        run: pip install -r requirements-ci.txt

      - name: Start frontend test server
        run: |
          nohup python -m http.server 4173 --directory dist > frontend-test.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat frontend-test.log
          exit 1

      - name: Run Selenium tests
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: http://127.0.0.1:4173
        run: pytest -q tests/e2e

      - name: Upload Selenium screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-${{ matrix.browser }}
          path: |
            artifacts/screenshots/
            frontend-test.log
          if-no-files-found: warn

  selenium-edge:
    name: Selenium - edge
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Edge tests with managed frontend server
        env:
          BROWSER: edge
          BASE_URL: http://127.0.0.1:4173
        run: python scripts/test_e2e.py

      - name: Upload Selenium screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-edge
          path: |
            artifacts/screenshots/
            frontend-test.log
            frontend-test-error.log
          if-no-files-found: warn
