name: DigiDARA CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend and tests
        run: npm run typecheck

      - name: Run Jest unit tests
        run: npm run test:ci

      - name: Upload frontend test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-coverage
          path: artifacts/frontend-coverage/
          if-no-files-found: warn

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  python-quality:
    name: Python lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            agents/**/requirements*.txt

      - name: Install Python quality tools
        run: python -m pip install -r requirements-quality.txt

      - name: Lint Python services
        run: python -m ruff check agents scripts tests

      - name: Check Python types
        run: python -m mypy

      - name: Run independent Python unit tests
        run: python -m pytest tests/unit -v --junitxml=artifacts/python-unit.xml

      - name: Upload Python unit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-unit-results
          path: artifacts/python-unit.xml
          if-no-files-found: warn

      - name: Compile Python services
        run: |
          python -m compileall -q \
            agents/orchestrator \
            agents/project_AI_Agent \
            agents/codeforge_agent/services/lms-api \
            agents/communication-ai-agent/backend \
            agents/aptitude_agent \
            agents/resume_builder_agent/backend \
            agents/certificate_agent

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create CI-only env files from examples
        shell: bash
        run: |
          set -euo pipefail
          for directory in agents/orchestrator agents/project_AI_Agent agents/codeforge_agent/services/lms-api agents/communication-ai-agent/backend agents/aptitude_agent agents/resume_builder_agent/backend agents/certificate_agent docker/mysql; do
            if [ -f "$directory/.env.example" ]; then
              cp "$directory/.env.example" "$directory/.env"
            else
              touch "$directory/.env"
            fi
          done
          # Judge0 config is deployment-local; validation needs the env file to exist.
          touch agents/codeforge_agent/judge0/judge0.conf

      - name: Validate Compose file
        run: docker compose config --quiet

  docker-build:
    name: Docker tests - ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent:
          - orchestrator
          - capstone-agent
          - codeforge-agent
          - communication-agent
          - aptitude-agent
          - resume-builder-agent
          - certificate-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            agents/**/requirements*.txt

      - name: Install health check dependencies
        run: python -m pip install 'pytest>=8.3,<10' 'pip-audit==2.10.1'

      - name: Resolve agent build context
        id: context
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          python - <<'PY'
          import os
          from scripts.test_agents import AGENTS
          context = next(a[1] for a in AGENTS if a[0] == os.environ['AGENT_NAME'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={context}\n')
          PY

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Build cached agent image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.path }}
          load: true
          tags: digidara-test/${{ matrix.agent }}:local
          cache-from: type=gha,scope=${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent }}

      - name: Run agent suites and real MySQL integration
        run: python scripts/test_agents.py --agent "${{ matrix.agent }}" --skip-build

      - name: Audit resolved Python dependencies
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          mkdir -p artifacts/security
          docker run --rm --entrypoint python digidara-test/${{ matrix.agent }}:local -m pip freeze > artifacts/security/requirements.txt
          python -m pip_audit --strict --no-deps --disable-pip \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-1325 \
            -r artifacts/security/requirements.txt -f json -o artifacts/security/pip-audit.json

      - name: Scan agent container vulnerabilities
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digidara-test/${{ matrix.agent }}:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/security/trivy.json

      - name: Upload agent security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.agent }}
          path: artifacts/security/
          if-no-files-found: warn

      - name: Upload agent test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-tests-${{ matrix.agent }}
          path: artifacts/agent-tests/${{ matrix.agent }}/
          if-no-files-found: warn

  frontend-docker:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f Dockerfile.frontend -t digidara-frontend:test .
      - name: Scan frontend container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digidara-frontend:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: frontend-trivy.json
      - name: Upload frontend security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-frontend-image
          path: frontend-trivy.json
          if-no-files-found: warn

  selenium-linux:
    name: Selenium - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            agents/**/requirements*.txt

      - name: Install Selenium test dependencies
        run: pip install -r requirements-ci.txt

      - name: Start frontend test server
        run: |
          nohup python -m http.server 4173 --directory dist > frontend-test.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat frontend-test.log
          exit 1

      - name: Run Selenium tests
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: http://127.0.0.1:4173
        run: pytest -q tests/e2e

      - name: Upload Selenium screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-${{ matrix.browser }}
          path: |
            artifacts/screenshots/
            frontend-test.log
          if-no-files-found: warn

  selenium-edge:
    name: Selenium - edge
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            agents/**/requirements*.txt

      - name: Install Selenium test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Edge tests with managed frontend server
        env:
          BROWSER: edge
          BASE_URL: http://127.0.0.1:4173
        run: python scripts/test_e2e.py

      - name: Upload Selenium screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-edge
          path: |
            artifacts/screenshots/
            frontend-test.log
            frontend-test-error.log
          if-no-files-found: warn

  npm-security:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-npm
          path: npm-audit.json
          if-no-files-found: error

  publish-ghcr:
    name: Publish image to GHCR - ${{ matrix.agent }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, frontend-docker, python-quality, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent:
          - orchestrator
          - capstone-agent
          - codeforge-agent
          - communication-agent
          - aptitude-agent
          - resume-builder-agent
          - certificate-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve agent build context
        id: context
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          python - <<'PY'
          import os
          from scripts.test_agents import AGENTS
          context = next(a[1] for a in AGENTS if a[0] == os.environ['AGENT_NAME'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={context}\n')
          PY

      - name: Compute lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.path }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/digidara-${{ matrix.agent }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/digidara-${{ matrix.agent }}:latest
          cache-from: type=gha,scope=${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent }}

  publish-ghcr-frontend:
    name: Publish frontend image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-docker, python-quality, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Compute lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/digidara-frontend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/digidara-frontend:latest

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-ghcr, publish-ghcr-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Record promoted images
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "Deploying commit ${{ github.sha }}"
          echo "Images published under ghcr.io/$owner/digidara-*:${{ github.sha }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash /opt/digidara-agents/deploy.sh

  notify-failure:
    name: Notify Slack on CI failure
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - python-quality
      - compose-validation
      - docker-build
      - frontend-docker
      - selenium-linux
      - selenium-edge
      - npm-security
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack failure notification
        if: contains(needs.*.result, 'failure')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skipping Slack notification."
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(printf '{"text":"CI failed on main for %s@%s\\n%s"}' \
            "${{ github.repository }}" "${{ github.sha }}" "$run_url")
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
