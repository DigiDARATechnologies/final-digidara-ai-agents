# DigiDARA jobs providers — configuration-driven company/source lists.
#
# Do not put secrets here. Provider credentials (e.g. Apify's API token)
# come from environment variables and are never committed to this file.

greenhouse:
  enabled: true

  # Jobs are only kept if BOTH filters pass:
  #   1. location_keywords: the job's location text must contain at least
  #      one of these (case-insensitive substring match). This is how the
  #      platform stays scoped to Tamil Nadu, Bengaluru, and Hyderabad.
  #   2. entry_level_only + exclude/entry title keywords: a title is
  #      dropped if it contains an exclude keyword (senior, lead, manager,
  #      ...) UNLESS it also contains an entry keyword (junior, associate,
  #      intern, ...), which always wins. Titles with no signal either way
  #      are kept by default (most plain "X Engineer" titles are entry/mid).
  # This is a heuristic on the title text Greenhouse provides, not a real
  # seniority field, so it will not be perfect — adjust the keyword lists
  # below as needed. Full Tamil Nadu district coverage (used for the
  # location engine's per-job classification, a separate and more precise
  # step than this keyword pre-filter) lives in tn_location.py.
  filters:
    entry_level_only: true
    location_keywords:
      - chennai
      - coimbatore
      - madurai
      - tiruchirappalli
      - trichy
      - salem
      - tiruppur
      - erode
      - vellore
      - tirunelveli
      - thoothukudi
      - thanjavur
      - dindigul
      - hosur
      - kanchipuram
      - chengalpattu
      - "tamil nadu"
      - tamilnadu
      - bengaluru
      - bangalore
      - hyderabad
    exclude_title_keywords:
      - senior
      - "sr."
      - staff
      - principal
      - lead
      - manager
      - director
      - "head of"
      - vp
      - "vice president"
      - chief
      - architect
    entry_title_keywords:
      - entry
      - junior
      - "jr."
      - associate
      - graduate
      - intern
      - trainee
      - fresher
      - campus
      - "new grad"
      - "early career"

  # Each entry is a company whose public Greenhouse job board should be
  # collected. `board_id` is the identifier Greenhouse uses in its public
  # Job Board API: https://boards-api.greenhouse.io/v1/boards/<board_id>/jobs
  #
  # `district`/`city`/`state`/`country`/`category` are registry-level
  # metadata about the company (its known primary Tamil Nadu presence,
  # per the verified source list) — informational only. They do NOT
  # determine whether any given fetched job counts as a Tamil Nadu job;
  # that is decided per-job, from the job's own location field, by
  # tn_location.py. A Tamil Nadu company can post non-Tamil Nadu jobs and
  # vice versa.
  #
  # `enabled: false` entries below are companies verified (both the
  # public API and the hosted job-boards.greenhouse.io career page
  # checked live) to have their Greenhouse board taken offline. The
  # board id itself was confirmed correct against each company's own
  # indexed postings before being marked disabled — this is not a
  # guess-the-slug situation. Re-enable if the board returns.
  #
  # This is a verified Tamil Nadu Greenhouse technology source *seed
