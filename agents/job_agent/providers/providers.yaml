# Apify scaffold — disabled until an API token and at least one actor are
# configured. Set the token via the APIFY_API_TOKEN environment variable
# (never in this file). See backend/jobs/providers/apify.py.
apify:
  enabled: true
  # Each entry is one job board scraped through an Apify actor, admin-run
  # manually (never on the automatic Greenhouse schedule) — see
  # admin_apify_run's `platform` argument and the "Run now" buttons per
  # platform in the admin Sources tab. `platform` is the dispatch key
  # providers/apify.py's normalize_job() uses to pick the right field
  # mapping for that actor's specific output shape.
  actors:
    - platform: naukri
      actor_id: crawloop/naukri-jobs-scraper
      enabled: true

    - platform: foundit
      actor_id: crawloop/foundit-jobs-scraper
      enabled: true

    - platform: hirist
      actor_id: crawloop/hirist-jobs-scraper
      enabled: true

    - platform: instahyre
      actor_id: parsebird/instahyre-jobs-scraper
      enabled: true

    - platform: internshala
      actor_id: hipersoft/internshala-scraper
      enabled: true

    - platform: indeed
      actor_id: solidscrape/indeed-jobs-scraper
      enabled: true

    - platform: glassdoor
      actor_id: simpleapi/glassdoor-jobs-scraper
      enabled: true

    # Pending: needs a LinkedIn actor id and a sample dataset item before
    # normalize_job() can map it (every LinkedIn-scraping actor on Apify
    # uses different field names) — kept here, disabled, as the known next
    # platform to wire up.
    - platform: linkedin
      actor_id: artificially/linkedin-jobs-scraper
      enabled: true
      run_input:
        searchQueries:
          - software engineer
        location: Chennai, Tamil Nadu, India
        maxJobs: 5
        jobType:
          - full-time
        remoteFilter: any

# Adzuna India Job Search API — Official REST API for regional postings.
# Credentials are read from ADZUNA_APP_ID and ADZUNA_APP_KEY in the environment.
adzuna:
  enabled: true
  queries:
    - what: "Fresher Software Engineer"
      where: "Chennai"
    - what: "Junior Developer"
      where: "Tamil Nadu"
    - what: "Graduate Trainee Developer"
      where: "Chennai"
    - what: "Junior Python Developer"
      where: "Chennai"
    - what: "Entry Level Developer"
      where: "Coimbatore"
    - what: "Fresher Web Developer"
      where: "Madurai"
    - what: "Junior Software Engineer"
      where: "Bengaluru"
    - what: "Junior Software Engineer"
      where: "Hyderabad"

# RapidAPI JSearch — Unified real-time search across LinkedIn, Indeed, Glassdoor.
# Token is read from RAPIDAPI_KEY in the environment.
jsearch:
  enabled: true
  queries:
    - query: "Software Engineer Fresher in Chennai"
    - query: "Junior Developer in Tamil Nadu"
    - query: "Python Developer Fresher in Coimbatore"
    - query: "Software Engineer Fresher in Bengaluru"
    - query: "Junior Software Engineer in Hyderabad"

