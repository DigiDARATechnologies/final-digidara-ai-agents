x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  # image/build below: the only intentional edit in this otherwise-untouched
  # vendored file. Building agents/codeforge_agent/judge0-worker-image adds
  # pandas/numpy to Judge0's Python 3.8.1 sandbox for the CodeForge Pandas/
  # NumPy courses -- see that Dockerfile for why. Compose treats a same-named
  # service redefined at the including project's top level as a conflict, not
  # a mergeable override, so this can't be done from the root docker-compose.yml.
  server:
    build:
      context: ../judge0-worker-image
    image: digidara-judge0-pandas-numpy:latest
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  worker:
    build:
      context: ../judge0-worker-image
    image: digidara-judge0-pandas-numpy:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data:
