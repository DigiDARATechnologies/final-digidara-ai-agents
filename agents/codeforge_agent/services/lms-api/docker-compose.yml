services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - codeforge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  codeforge_mysql_data:
