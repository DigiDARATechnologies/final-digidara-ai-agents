<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Conversational Exam — CertifyAI</title>
    <link rel="stylesheet" href="/cert/static/css/styles.css" />
</head>

<body class="body-fixed-layout">
    <div class="bg-anim"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/dashboard" class="nav-brand">⚡ CertifyAI</a>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/chat" style="color: var(--primary-orange); font-weight: 600;">AI Chat Exam ⚡</a>
            <span class="nav-user" id="userDisplayName">Student</span>
            <a href="#" onclick="Auth.logout()">Logout</a>
        </div>
    </nav>

    <!-- Chat Interface Layout -->
    <div class="chat-layout">
        <!-- Left Sidebar -->
        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">🎓 Exam Sessions</div>
                <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="startNewSession()">
                    + New Exam
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <div class="spinner" style="width: 24px; height: 24px;"></div>
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="chat-main">
            <!-- Chat Exam Header (Only shown during active chat exams) -->
            <div class="chat-exam-header" id="chatExamHeader" style="display: none;">
                <div class="chat-exam-header-info">
                    <span class="chat-exam-topic" id="chatExamTopic">Exam</span>
                    <span class="chat-exam-q-counter" id="chatExamQCounter">Question 1 / 30</span>
                </div>
                <div class="chat-exam-timer" id="chatExamTimer">⏱ 03:00</div>
            </div>

            <!-- Mobile Chat Header -->
            <div class="chat-header-mobile">
                <button type="button" class="btn-sidebar-toggle" onclick="toggleMobileSidebar()" aria-label="Toggle Sidebar">
                    ☰
                </button>
                <div class="chat-header-title">AI Chat Exam</div>
                <button type="button" class="btn-new-exam-mobile" onclick="startNewSession()" aria-label="New Exam">
                    ＋
                </button>
            </div>

            <!-- Messages Scroll Area -->
            <div class="chat-messages-container" id="messagesContainer">
                <!-- Welcome Message & Conversation History renders dynamically here -->
            </div>

            <!-- Bottom Chat Input Bar -->
            <div class="chat-input-bar">
                <form class="chat-input-form" id="chatForm" onsubmit="handleChatSubmit(event)">
                    <div class="input-container-floating">
                        <input
                            type="text"
                            id="messageInput"
                            class="form-input-floating"
                            placeholder="Enter exam topic or your answer..."
                            autocomplete="off"
                        />
                        <button type="submit" id="sendBtn" class="btn-send-floating" aria-label="Send Message">
                            ⚡
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Core UI Scripts -->
    <script src="/cert/static/js/auth.js"></script>
    <script src="/cert/static/js/chat.js"></script>
</body>

</html>
