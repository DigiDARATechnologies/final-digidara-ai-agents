server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Capstone submissions attach a .docx report + .zip source archive —
    # nginx's 1MB default silently rejects those with a 413 long before the
    # request reaches the orchestrator.
    client_max_body_size 50M;

    # Reverse-proxy every orchestrator prefix the frontend calls, by the
    # orchestrator's Docker service name — its own port is never published
    # to the host, so this is the only way the browser can reach it.
    location = /auth/google/callback {
        try_files $uri /index.html;
    }

    location /auth/ {
        proxy_pass http://orchestrator:8100/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /chat/ {
        proxy_pass http://orchestrator:8100/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /gateway/ {
        proxy_pass http://orchestrator:8100/gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /billing/ {
        proxy_pass http://orchestrator:8100/billing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /registry/ {
        proxy_pass http://orchestrator:8100/registry/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router / client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
