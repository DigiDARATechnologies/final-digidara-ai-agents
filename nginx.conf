# Which responses search engines must keep out of their index. This file is included
# inside nginx's http block, so a map is allowed here. An empty value adds no header, so
# every public page, image and file (home, /agents/, /pricing/, /faq/, /for-colleges/,
# sitemap, robots, icons) stays indexable. The routes below are the app's private ones:
# the login page, the links Boss and organizations send (they carry a private token),
# the Google sign-in return, and the API prefixes proxied to the orchestrator. The pages
# among them (/login and the token links) are deliberately NOT blocked in robots.txt: a
# crawler that cannot fetch a page never sees its noindex header.
map $request_uri $robots_header {
    default "";
    ~^/login/?(\?|$) "noindex, nofollow";
    ~^/(shared/chat|certificate-link|assessment)/ "noindex, nofollow";
    ~^/auth/ "noindex, nofollow";
    ~^/(chat|gateway|billing|platform-admin|registry|learner|organizations|a2a|voice|conductor|links|proctoring|assessments|my-assessments|knowledge|courses|course-media|chats|agent-state)(/|\?|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    # Redirects below are relative ("/agents/"), so a browser stays on the public https://www
    # address that the TLS-terminating proxy in front of this container serves.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    # Capstone submissions attach a .docx report + .zip source archive —
    # nginx's 1MB default silently rejects those with a 413 long before the
    # request reaches the orchestrator.
    client_max_body_size 210M;  # docx + zip, each up to MAX_UPLOAD_MB (100)

    # Baseline security headers. Deliberately NOT included here:
    # - Content-Security-Policy: getting this wrong (e.g. blocking Google's
    #   accounts.google.com origin) would re-break the Google OAuth flow;
    #   needs to be built and tested deliberately, not added blind.
    # - Strict-Transport-Security: this nginx only ever speaks plain HTTP
    #   internally (TLS is terminated in front of it, e.g. by aaPanel) --
    #   HSTS is safest to set at that TLS-terminating layer, since browsers
    #   cache it aggressively and a mistake here isn't easily reversible.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $robots_header always;
    # Microphone stays allowed (voice input, mock interview, pronunciation
    # practice all use it), and the camera for proctored tests (Hard and
    # Professional interviews and vivas, assessment links); everything else
    # this app has no use for is off.
    add_header Permissions-Policy "camera=(self), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), microphone=(self)" always;
    # Content-Security-Policy: the browser runs only this site's own scripts
    # (no inline scripts at all -- the theme bootstrap is public/theme-init.js),
    # so an XSS bug can't run injected code or send the login token elsewhere.
    # The one inline style allowed (by its sha256) is the one the screenshot
    # library (html2canvas-pro, Boss "look at my screen") adds to its copy of the page.
    # No inline styles either (style-src 'self'): React sets style props through
    # the DOM, which CSP allows, and the first-paint CSS is public/first-paint.css.
    # Fonts are this site's own (@fontsource-variable/inter), and images are this
    # site's, data:/blob: (uploaded avatars, PDF previews) or Razorpay's.
    # Every other source listed is one the app actually uses: Razorpay checkout
    # (its scripts, iframe and API, all on *.razorpay.com), blob:/data: for PDF
    # previews, recorded audio and avatars. Google sign-in and the Razorpay
    # payment pages are full-page navigations, which CSP does not restrict.
    # Adding a third-party script, iframe or API later means adding it here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'sha256-UP0QZg7irvSMvOBz9mH2PIIE28+57UiavRfeVea0l3g='; font-src 'self' data:; img-src 'self' data: blob: https://*.razorpay.com; media-src 'self' data: blob:; connect-src 'self' https://*.razorpay.com; frame-src 'self' blob: https://*.razorpay.com https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Real client IP. TLS is terminated by aaPanel's nginx on the host, which
    # proxies to this container's published port -- so $remote_addr here is
    # always the Docker bridge gateway, and the orchestrator's per-IP login /
    # signup rate limits used to share ONE bucket for every visitor (anyone
    # could lock everyone out with 5 requests a minute). Trust X-Forwarded-For
    # only from private/loopback hops; real_ip_recursive walks it from the
    # right, so a value a client forges is ignored as long as aaPanel's proxy
    # appends ($proxy_add_x_forwarded_for, its default) or overwrites it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Inherited by every proxied location below (none sets its own
    # proxy_set_header, which would discard these). X-Forwarded-For is
    # overwritten, not appended, so the orchestrator -- which trusts it, see
    # its Dockerfile's --forwarded-allow-ips -- only ever sees the one
    # client address recovered above.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Look the orchestrator up through Docker's DNS on every request (cached
    # 10 s) instead of once at startup. A deploy recreates the orchestrator
    # with a new IP; nginx used to keep the old one, so every API call returned
    # 502 until this container was restarted (6 Oct 2026: ~1.5 h of failed
    # logins while the home page still loaded). proxy_pass with a variable and
    # no URI passes the request path through unchanged, exactly like the
    # /prefix/ -> /prefix/ mappings it replaces.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orchestrator http://orchestrator:8100;
    # During a rolling restart (scripts/rolling-orchestrator.sh) the name can
    # still point at the stopped container for a few seconds: give up on it
    # fast and try the other address. A connect inside Docker takes < 1 ms.
    proxy_connect_timeout 2s;

    # Reverse-proxy every orchestrator prefix the frontend calls, by the
    # orchestrator's Docker service name — its own port is never published
    # to the host, so this is the only way the browser can reach it.
    location = /auth/google/callback {
        try_files $uri /index.html;
    }

    location /auth/ {
        proxy_pass $orchestrator;
    }

    location /chat/ {
        proxy_pass $orchestrator;
    }

    location /gateway/ {
        proxy_pass $orchestrator;
        # Aptitude create_test may wait for a complete batch (up to 180 s).
        proxy_read_timeout 240s;
    }

    # Cross-device chat history (orchestrator app/chat_history/routes.py:
    # GET/POST /chats and POST /chats/sync). Without this rule those requests
    # fell through to the SPA fallback below, which answers POST with 405, so
    # history sync never worked in production. Regex form so the original URI
    # (including the bare /chats) is passed through unchanged.
    location ~ ^/chats(/|$) {
        proxy_pass $orchestrator;
    }

    # Per-agent conversation progress (orchestrator app/agent_state/routes.py):
    # GET /agent-state and PUT/DELETE /agent-state/{agent}/{chat}. Regex form for
    # the same reason as /chats: without a rule the SPA fallback answers 405.
    location ~ ^/agent-state(/|$) {
        proxy_pass $orchestrator;
    }

    # Platform admin API (orchestrator app/admin/routes.py). Admin-only: every route
    # checks the caller's is_admin flag, so exposing the prefix is safe.
    location /platform-admin/ {
        proxy_pass $orchestrator;
    }

    location /billing/ {
        proxy_pass $orchestrator;
    }

    location /registry/ {
        proxy_pass $orchestrator;
    }

    # Phase 2 (orchestrator app/learner, app/organizations, app/a2a, app/voice,
    # app/links): learner profile, readiness, memory and career plan,
    # organizations, the A2A hub's JSON-RPC and agent cards, natural voice, and
    # the chat and certificate links Boss makes (the pages that open them,
    # /shared/chat/... and /certificate-link/..., are the app's own). Regex form
    # so the bare /organizations (POST to create one) is passed through unchanged, like /chats.
    # /proctoring, /assessments, /my-assessments and /knowledge are the proctored tests' API;
    # /courses and /course-media the courses (videos stream with byte ranges); the page an
    # assessment link opens, /assessment/<token> (singular), is the app's own.
    location ~ ^/(learner|organizations|a2a|voice|conductor|links|proctoring|assessments|my-assessments|knowledge|courses|course-media)(/|$) {
        proxy_pass $orchestrator;
        # Readiness asks every agent for its summary in one request, and a
        # career plan adds an LLM turn on top.
        proxy_read_timeout 180s;
        # A2A message/stream is Server-Sent Events: pass each event at once.
        proxy_buffering off;
    }

    location = /.well-known/agent-card.json {
        proxy_pass $orchestrator;
    }

    # Built JS/CSS: the file name changes with every build (index-<hash>.js),
    # so a browser may keep it for a year. A missing one is a real 404, never
    # index.html served as a script.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # One address per public page: /agents -> /agents/ (each page's canonical URL ends in a
    # slash), so Google never sees the same page at two addresses.
    location ~ ^/(agents|pricing|faq|for-colleges)$ {
        return 301 $uri/;
    }
    location ~ ^/agents/[a-z0-9-]+$ {
        return 301 $uri/;
    }

    # The routes the single-page app answers itself. These are every path the app reads
    # (App.tsx: /login and the Google return above; lib/linkPaths.ts: the three link
    # kinds). They get index.html with a 200 and, through $robots_header above, noindex.
    # index.html (and the other unhashed files) is re-checked on every visit, so a new
    # release reaches visitors at once; `expires` sets Cache-Control without add_header,
    # so the headers above still apply.
    location ~ ^/login/?$ {
        try_files /index.html =404;
        expires -1;
    }
    location ~ "^/(shared/chat|certificate-link|assessment)/[A-Za-z0-9_.-]{10,1200}/?$" {
        try_files /index.html =404;
        expires -1;
    }

    # Everything else is a real file or a public page ($uri/index.html serves /agents/,
    # /pricing/ ...), or a real 404. It used to fall back to index.html with a 200, so
    # any mistyped address looked like a second copy of the home page to Google.
    location / {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
